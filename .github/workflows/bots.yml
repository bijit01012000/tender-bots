# GitHub Actions (ADR-013): every hour at :17 — tender watcher + deadline reminders (sent only
# 08:00–21:59 IST, each reminder once). GitHub may delay or drop scheduled runs; running hourly
# means the next run catches up (no repeats: both bots remember what they sent).
# PUBLIC repo: business data comes only from secrets, bot output goes to the encrypted
# state (state.enc), and the visible log shows nothing but exit codes.
name: bots
on:
  schedule:
    - cron: "17 * * * *"     # hourly, off the busy top of the hour
  workflow_dispatch:
    inputs:
      job: {description: "bids | reminders | both | test", default: "both"}
# one run at a time; each starts from the memory the previous run saved (no repeats)
concurrency: {group: bots, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WORK_DIR: state
      STATE_KEY: ${{ secrets.STATE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      REMINDER_BOT_TOKEN: ${{ secrets.REMINDER_BOT_TOKEN }}
      REMINDER_CHAT_IDS: ${{ secrets.REMINDER_CHAT_IDS }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}   # latest memory, not the commit the run was queued at
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q -r requirements.txt
      - name: Load private settings and memory
        env:
          PROFILE_B64: ${{ secrets.AMC_PROFILE_B64 }}
          OBLIGATIONS_B64: ${{ secrets.OBLIGATIONS_B64 }}
        run: |
          printf '%s' "$PROFILE_B64" | base64 -d > config/amc_profile.json
          printf '%s' "$OBLIGATIONS_B64" | base64 -d > config/obligations.json
          python -m apps.state_vault unpack
          echo "LOADED=1" >> "$GITHUB_ENV"   # only then may the memory be saved back
      - name: Tender watcher
        timeout-minutes: 12   # stuck → stop, but still save what was sent
        if: github.event_name == 'schedule' || inputs.job == 'bids' || inputs.job == 'both'
        run: |
          rc=0
          { echo "== bids $(date -u +%FT%TZ)"; python -m apps.bidwatch run; } >> state/run.log 2>&1 || rc=$?
          echo "tender watcher: exit $rc"; echo "BIDS_RC=$rc" >> "$GITHUB_ENV"
      - name: Reminders
        timeout-minutes: 5
        if: github.event_name == 'schedule' || inputs.job == 'reminders' || inputs.job == 'both'
        run: |
          rc=0
          { echo "== reminders $(date -u +%FT%TZ)"; python -m apps.reminders run --hours 8-21; } >> state/run.log 2>&1 || rc=$?
          echo "reminders: exit $rc"; echo "REM_RC=$rc" >> "$GITHUB_ENV"
      - name: Test message from both bots
        if: github.event_name == 'workflow_dispatch' && inputs.job == 'test'
        run: |
          python - > /tmp/test.out 2>&1 <<'PY' || true
          from apps.bidwatch import load_env, send
          env = load_env()
          print(send("☁️ <b>Tender bot now runs on GitHub</b>\n━━━━━━━━━━━━━━━━━━━━\n"
                     "🔎 Checks NALCO tenders every 2 hours\n💻 Your Mac is no longer needed", env))
          print(send("☁️ <b>Reminder bot now runs on GitHub</b>\n━━━━━━━━━━━━━━━━━━━━\n"
                     "⏰ Deadline reminders every day at 9:00 AM\n💻 Your Mac is no longer needed",
                     env, prefix="REMINDER"))
          PY
          n=$(grep -o ": 200" /tmp/test.out | wc -l); echo "test messages delivered: $n of 2"; [ "$n" -ge 2 ]
      - name: Save memory (encrypted)
        if: always() && env.LOADED == '1'
        run: |
          force=""; [ "${BIDS_RC:-0}${REM_RC:-0}" = "00" ] || force=--force
          python -m apps.state_vault pack $force
          git config user.name "bots"
          git config user.email "bots@users.noreply.github.com"
          git add state.enc state.fp
          git diff --cached --quiet && exit 0
          git commit -q -m "state"
          for i in 1 2 3 4 5; do   # a lost save would mean repeats next run: retry hard
            git push -q && exit 0
            sleep $((i * 10)); git pull -q --rebase origin main || true
          done
          echo "could not save memory"; exit 1
      - name: Fail if a bot failed
        run: '[ "${BIDS_RC:-0}" = 0 ] && [ "${REM_RC:-0}" = 0 ]'
